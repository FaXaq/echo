name: echo

services:
  echo-postgres:
    image: postgres:17-alpine
    container_name: echo-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-echo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-echo}
      POSTGRES_DB: ${POSTGRES_DB:-echo}
    volumes:
      - echo-pgdata:/var/lib/postgresql/data

  echo-mailpit:
    image: axllent/mailpit:latest
    container_name: echo-mailpit
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  echo-localstack:
    image: localstack/localstack:latest
    container_name: echo-localstack
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-echo-dev}
    volumes:
      - echo-localstack-data:/var/lib/localstack
      - ./docker/localstack/init-s3.sh:/etc/localstack/init/ready.d/init-s3.sh

volumes:
  echo-pgdata:
  echo-localstack-data:
