name: Docker Build

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      apps:
        required: false
        type: string
        default: '["api","web","cli"]'

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: ${{ fromJSON(inputs.apps) }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.version }}

      - id: owner
        run: echo "lowercase=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=${{ matrix.app == 'web' && vars.VITE_API_URL || '' }}
          tags: |
            ghcr.io/${{ steps.owner.outputs.lowercase }}/echo-${{ matrix.app }}:${{ inputs.version }}
            ghcr.io/${{ steps.owner.outputs.lowercase }}/echo-${{ matrix.app }}:latest
